        function clearDropMarks() {
          els.tree.querySelectorAll(".drop-before, .drop-after, .drop-inside").forEach((row) => {
            row.classList.remove("drop-before", "drop-after", "drop-inside");
          });
        }

        function dropTargetFromPoint(x, y) {
          const element = document.elementFromPoint(x, y);
          const row = element && element.closest(".page-row");
          if (!row || !els.tree.contains(row)) return null;
          const rect = row.getBoundingClientRect();
          const ratio = rect.height ? (y - rect.top) / rect.height : 0.5;
          const zone = ratio < 0.28 ? "before" : ratio > 0.72 ? "after" : "inside";
          return { row: row, zone: zone };
        }

        function cleanupTreeDrag() {
          dragId = "";
          dragPointer = null;
          dragMoved = false;
          document.body.classList.remove("page-dragging");
          if (dragGhost) { dragGhost.remove(); dragGhost = null; }
          els.tree.querySelectorAll(".dragging").forEach((row) => row.classList.remove("dragging"));
          clearDropMarks();
        }

        function performTreeDrop(dragged, target) {
          if (!dragged) return;
          if (!target) { reorderNote(dragged, null, 9999); return; }
          const targetId = target.row.dataset.id;
          if (targetId === dragged) return;
          if (target.zone === "inside") {
            if (isDescendantLocal(targetId, dragged)) return;
            const count = activeNotes().filter((note) => note.parentId === targetId).length;
            reorderNote(dragged, targetId, count);
            return;
          }
          const targetNote = noteById(targetId);
          if (!targetNote) return;
          const parentId = targetNote.parentId || null;
          if (parentId && (parentId === dragged || isDescendantLocal(parentId, dragged))) return;
          const siblings = activeNotes()
            .filter((note) => (note.parentId || null) === parentId && note.id !== dragged)
            .sort(sortSiblings);
          let index = siblings.findIndex((note) => note.id === targetId);
          if (index < 0) index = siblings.length;
          if (target.zone === "after") index += 1;
          reorderNote(dragged, parentId, index);
        }

        // ---------------------------------------------------------------
        // Modals
        // ---------------------------------------------------------------
        function modal(inner) {
          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + inner + "</div>";
          document.body.appendChild(overlay);
          const close = () => overlay.remove();
          overlay.addEventListener("mousedown", (event) => { if (event.target === overlay) close(); });
          overlay.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", close));
          const onKey = (event) => { if (event.key === "Escape") { close(); document.removeEventListener("keydown", onKey); } };
          document.addEventListener("keydown", onKey);
          return { overlay, close };
        }

        function confirmDialog(message, danger) {
          return new Promise((resolve) => {
            const ref = modal('<h3>' + esc(t("confirmTitle")) + "</h3><p>" + esc(message) + "</p>" +
              '<div class="actions"><button class="btn" data-close>' + esc(t("cancel")) + "</button>" +

        async function downloadNote(note) {
          const name = (note.title || t("untitled")).replace(/[\\/:*?"<>|]/g, "-") + ".md";
          const text = note.body || "";
          const transfer = host && host.fileTransfer;
          const capability = host && host.capabilities && host.capabilities.fileTransfer;
          // The sandbox blocks <a download>, so desktop hosts save through the
          // native dialog; the browser host falls back to the anchor below.
          if (transfer && typeof transfer.beginSave === "function" && (!capability || capability.beginSave !== false)) {
            try {
              const bytes = new TextEncoder().encode(text);
              const target = await transfer.beginSave({ name: name, contentType: "text/markdown;charset=utf-8", size: bytes.byteLength });
              if (!target) return;
              await transfer.write(target.handleId, 0, bytes);
              await transfer.finish(target.handleId);
              toast(t("downloaded"), "ok");
              return;
            } catch (error) {
              // Fall through to the browser download path.
            }
          }
          try {
            const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = url;
            anchor.download = name;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 2000);
          } catch (error) {
            toast(t("downloadFailed") + ": " + (error.message || error), "err");
          }
        }

        async function copyNote(note) {
          try {
            if (host && host.clipboard && typeof host.clipboard.writeText === "function") {
              await host.clipboard.writeText(note.body);
              toast(t("copied"), "ok");
              return;
            }
            await navigator.clipboard.writeText(note.body);
            toast(t("copied"), "ok");
          } catch (_) {
            const area = document.createElement("textarea");
            area.value = note.body;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            const ok = document.execCommand("copy");
            area.remove();
            toast(ok ? t("copied") : t("copyFailed"), ok ? "ok" : "err");
          }
        }

            const actionEl = event.target.closest("[data-action]");
            if (actionEl) {
              event.stopPropagation();
              const id = actionEl.dataset.id;
              const action = actionEl.dataset.action;
              if (action === "toggle") {
                if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
                renderTree();
              } else if (action === "star") { toggleFavorite(id); }
              else if (action === "child") { createNote(id); }
              else if (action === "menu") { pageMenu(id); }
              else if (action === "restore") { restoreNote(id); }
              else if (action === "purge") { purgeNote(id); }
              return;
            }
            const row = event.target.closest(".page-row");
            if (row) { if (filter === "trash") return; selectNote(row.dataset.id); }
          });
          els.tree.addEventListener("pointerdown", (event) => {
            if (event.button !== 0 || filter !== "all" || query.trim()) return;
            if (event.target.closest("button, input, textarea, select, a")) return;
            const row = event.target.closest(".page-row");
            if (!row) return;
            dragPointer = { id: row.dataset.id, x: event.clientX, y: event.clientY, row: row };
            dragMoved = false;
          });
          window.addEventListener("pointermove", (event) => {
            if (!dragPointer) return;
            if (!dragMoved) {
              if (Math.abs(event.clientY - dragPointer.y) < 4) return;
              dragMoved = true;
              dragId = dragPointer.id;
              dragPointer.row.classList.add("dragging");
              document.body.classList.add("page-dragging");
              const rect = dragPointer.row.getBoundingClientRect();
              dragGhost = dragPointer.row.cloneNode(true);
              dragGhost.classList.add("drag-ghost");
              dragGhost.style.width = rect.width + "px";
              dragGhost.style.pointerEvents = "none";
              dragGhost.style.left = (event.clientX + 8) + "px";
              dragGhost.style.top = (event.clientY + 8) + "px";
              document.body.appendChild(dragGhost);
            }
            event.preventDefault();
            if (dragGhost) {
              dragGhost.style.left = (event.clientX + 8) + "px";
              dragGhost.style.top = (event.clientY + 8) + "px";
            }
            clearDropMarks();
            if (dragGhost) dragGhost.style.display = "none";
            const target = dropTargetFromPoint(event.clientX, event.clientY);
            if (dragGhost) dragGhost.style.display = "";
            if (!target || target.row.dataset.id === dragId) return;
            if (target.zone === "inside" && isDescendantLocal(target.row.dataset.id, dragId)) return;
            target.row.classList.add("drop-" + target.zone);
          }, { passive: false });
          window.addEventListener("pointerup", (event) => {
            if (!dragPointer) return;
            const wasMoved = dragMoved;
            const dragged = dragId;
            if (dragGhost) dragGhost.style.display = "none";
            const target = wasMoved ? dropTargetFromPoint(event.clientX, event.clientY) : null;
            cleanupTreeDrag();
            if (wasMoved) {
              suppressClick = true;
              setTimeout(() => { suppressClick = false; }, 80);
              performTreeDrop(dragged, target);
            }
          });
          window.addEventListener("pointercancel", () => {
            if (!dragPointer) return;
            cleanupTreeDrag();
          });
          els.main.addEventListener("click", (event) => {
            const attachmentLink = event.target.closest("a[data-attachment-id]");
            if (attachmentLink) {
              event.preventDefault();
              downloadAttachment(attachmentLink.dataset.attachmentId, attachmentLink.dataset.attachmentName);
              return;
            }
            const fileLink = event.target.closest("a[data-download-url]");
            if (fileLink) {
              event.preventDefault();
              downloadDataUrl(fileLink.dataset.downloadName, fileLink.dataset.downloadUrl);
              return;
            }
            const actionEl = event.target.closest("[data-action]");
            if (actionEl) {
              const id = actionEl.dataset.id || selectedId;
              const action = actionEl.dataset.action;
              if (action === "star") toggleFavorite(id);
              else if (action === "menu") pageMenu(id);
              else if (action === "download") { const note = noteById(id); if (note) downloadNote(note); }
              else if (action === "new") createNote(null);
              else if (action === "crumb") selectNote(id);
              else if (action === "child-page") selectNote(id);
              else if (action === "toggle-children") {
                childPanelCollapsed = !childPanelCollapsed;
                const panel = document.getElementById("child-pages");
                if (panel) panel.classList.toggle("collapsed", childPanelCollapsed);
              }
              else if (action === "restore") restoreNote(id);
              else if (action === "purge") purgeNote(id);
              else if (action === "pick-icon") pickIcon(id);
              else if (action === "empty-trash") emptyTrash();
              else if (action === "toggle-sidebar") { toggleSidebar(); }
              return;
            }
            const md = event.target.closest("[data-md]");
            if (md) { applyMarkdown(md.dataset.md); return; }
          });
          els.scrim.addEventListener("click", closeSidebar);
          document.addEventListener("keydown", (event) => {
            const mod = event.metaKey || event.ctrlKey;
            if (mod && event.key.toLowerCase() === "k") { event.preventDefault(); els.search.focus(); els.search.select(); }
            else if (mod && event.key.toLowerCase() === "n") { event.preventDefault(); createNote(null); }
            else if (mod && event.key.toLowerCase() === "s") { event.preventDefault(); saveNow(true); }
            else if (event.key === "Escape" && els.sidebar.classList.contains("open")) { closeSidebar(); }
          });
          document.addEventListener("selectionchange", () => {
            if (document.getElementById("live-editor")) updateTableTools();
          });
          window.addEventListener("scroll", () => {
            if (document.getElementById("live-editor")) updateTableTools();
          }, true);
          window.addEventListener("beforeunload", (event) => { if (dirty) { event.preventDefault(); event.returnValue = ""; } });
        }

        function applyLocale(next) {
          const normalized = normalizeLocale(next);
          if (normalized === locale) return;
          locale = normalized;
          document.documentElement.lang = locale;
          // Rebuild open dialogs so they do not mix two languages.
          document.querySelectorAll(".overlay").forEach((overlay) => overlay.remove());
          renderChrome();
          renderTree();
          renderMain();
        }

        function applyTheme(theme) {
          if (theme && theme.appearance) document.documentElement.dataset.dbxTheme = theme.appearance;
          if (theme && theme.tokens) {
            Object.keys(theme.tokens).forEach((key) => {
              if (key.indexOf("--color-") === 0 || key.indexOf("--radius-") === 0 || key.indexOf("--font-") === 0) {
                document.documentElement.style.setProperty(key, theme.tokens[key]);
              }
            });
          }
        }

        function wireHost() {
          if (!host || hostWired) return;
          hostWired = true;
          applyTheme(host.theme);
          window.addEventListener("dbx-plugin-env", (event) => {
            const detail = event.detail || {};
            if (detail.locale) applyLocale(detail.locale);
            if (detail.theme) applyTheme(detail.theme);
          });
          host.onContext((context) => {
            const next = (context && context.connectionId) || "";
            if (next !== connectionId) {
              connectionId = next;
              boot().catch((error) => fatal(error.message));
            }
          });
          if (host.onEvent) {
            host.onEvent((event) => {
              if (event && event.method === "notes/sync" && !syncing) {
                sync.lastResult = event.params && event.params.message;
                sync.lastSyncAt = event.params && event.params.at;
                renderSyncLine();
              }
            });
          }
        }

        async function boot() {
          if (!host) throw new Error("window.dbxPlugin is missing");
          const context = (await host.ready) || host.context || {};
          connectionId = context.connectionId || "";
          locale = normalizeLocale(host.locale || locale);
          selectedId = readPref("selected", "");
          sidebarHidden = readPref("sidebarHidden", "0") === "1";
          welcomeId = readPref("welcomeId", "note-welcome");
          try {
            const stored = JSON.parse(readPref("tabs", ""));
            if (Array.isArray(stored)) openTabs = stored.filter((value) => typeof value === "string");
          } catch (_) {}
          tabLayout = readPref("tabLayout", "single") === "multi" ? "multi" : "single";
          applySidebar();
          document.documentElement.lang = locale;
          bindGlobalEvents();
          wireHost();
          const data = await rpc("notes/snapshot", {});
          vault = data.vault || { name: "DBX Notes", notes: [] };
          settings = data.settings || settings;
          sync = data.sync || {};
          if (!vault.notes.find((note) => note.id === selectedId && !note.deletedAt)) {
            const first = activeNotes().sort(sortSiblings)[0];
            selectedId = first ? first.id : "";
            writePref("selected", selectedId);
          }
          if (!openTabs.length) {
            openTabs = [HOME_TAB];
            if (selectedId) openTabs.push(selectedId);
          }
          sanitizeTabs();
          renderChrome();
          renderTree();
          renderMain();
          scheduleAutoSync();
        }

        try {
          boot().catch((error) => fatal(error.message || String(error)));
        } catch (error) {
          fatal(error.message || String(error));
        }
      })();
    </script>
  </body>
</html>
