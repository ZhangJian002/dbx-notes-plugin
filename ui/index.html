            return cells.length ? cells[cells.length - 1] : node;
          }
          return node;
        }

        function insertMarkdownBlocks(editor, text) {
          const ids = Array.from(new Set(Array.from(text.matchAll(/attachment:([A-Za-z0-9-]+)/g)).map((match) => match[1])));
          const source = text.replace(/attachment:([A-Za-z0-9-]+)/g, "dbx-attachment:$1");
          const holder = document.createElement("div");
          holder.innerHTML = markdownToHtml(source);
          const blocks = Array.from(holder.childNodes);
          if (!blocks.length) return;
          const selection = window.getSelection();
          if (!selection || !selection.rangeCount) return;
          const before = captureHistoryState();
          const block = currentLiveBlock(editor);
          let anchorNode;
          if (block && block.parentElement === editor && (block.tagName === "P" || block.tagName === "DIV") && !blockHasContent(block)) {
            block.replaceWith(...blocks);
            anchorNode = blocks[blocks.length - 1];
          } else if (block) {
            let host = block;
            while (host.parentElement && host.parentElement !== editor) host = host.parentElement;
            let last = host;
            blocks.forEach((node) => { last.after(node); last = node; });
            anchorNode = last;
          } else {
            blocks.forEach((node) => editor.appendChild(node));
            anchorNode = blocks[blocks.length - 1];
          }
          placeCaretAtEnd(lastEditable(anchorNode));
          liveSerialize(editor);
          recordProgrammatic(before);
          if (ids.length) {
            loadAttachmentMap(ids).then((map) => {
              editor.querySelectorAll('img[src^="dbx-attachment:"]').forEach((img) => {
                const id = img.getAttribute("src").slice("dbx-attachment:".length);
                const url = map[id];
                if (url) {
                  img.src = url;
                  img.dataset.attachmentId = id;
                }
              });
              editor.querySelectorAll('a[data-download-url^="dbx-attachment:"]').forEach((link) => {
                const id = link.getAttribute("data-download-url").slice("dbx-attachment:".length);
                link.removeAttribute("data-download-url");
                link.setAttribute("data-attachment-id", id);
                link.setAttribute("data-attachment-name", link.textContent || "");
              });
              lastHistoryState = captureHistoryState();
            });
          }
        }

        function looksLikeMarkdownBlocks(text) {
          return /(^|\n)\s{0,3}(#{1,6}\s|[-*+]\s|\d+\.\s|>\s|```|\|.*\|)|\n\s*---\s*(\n|$)|^(---|\*\*\*|___)$/.test(text) || /\n/.test(text);
        }

        let tableTools = null;

        function currentTableCell() {
          const selection = window.getSelection();
          if (!selection || !selection.rangeCount) return null;
          const node = selection.anchorNode;
          if (!node) return null;
          const element = node.nodeType === 3 ? node.parentElement : node;
          return element && element.closest ? element.closest("td, th") : null;
        }

        function setCaretIn(node) {
          if (!node) return;
          const range = document.createRange();
          range.selectNodeContents(node);
          range.collapse(true);
          const selection = window.getSelection();
          if (!selection) return;
          selection.removeAllRanges();
          selection.addRange(range);
        }

        function ensureTableTools() {
          if (tableTools) return tableTools;
          tableTools = document.createElement("div");
          tableTools.className = "table-tools";
          tableTools.id = "table-tools";
          tableTools.hidden = true;
          tableTools.innerHTML = '<button data-table="row-add">+ 行</button><button data-table="col-add">+ 列</button><button data-table="row-del">− 行</button><button data-table="col-del">− 列</button><button class="danger" data-table="table-del">删除表格</button>';
          tableTools.addEventListener("mousedown", (event) => event.preventDefault());
          tableTools.addEventListener("click", (event) => {
            const button = event.target.closest("[data-table]");
            if (button) tableAction(button.dataset.table);
          });
          document.body.appendChild(tableTools);
          return tableTools;
        }

        function updateTableTools() {
          const tools = ensureTableTools();
          const editor = document.getElementById("live-editor");
          const cell = currentTableCell();
          if (!editor || !cell || !editor.contains(cell)) {
            tools.hidden = true;
            return;
          }
          const table = cell.closest("table");
          if (!table) {
            tools.hidden = true;
            return;
          }
          const rect = table.getBoundingClientRect();
          tools.hidden = false;
          tools.style.top = Math.max(6, Math.min(rect.bottom + 6, window.innerHeight - tools.offsetHeight - 8)) + "px";
          tools.style.left = Math.max(6, Math.min(rect.left, window.innerWidth - tools.offsetWidth - 8)) + "px";
          const row = cell.closest("tr");
          const header = row && row.parentElement && row.parentElement.tagName === "THEAD";
          const bodyRows = table.querySelectorAll("tbody tr").length;
          const columns = row ? row.children.length : 0;
          const rowDelete = tools.querySelector('[data-table="row-del"]');
          const colDelete = tools.querySelector('[data-table="col-del"]');
          if (rowDelete) rowDelete.disabled = !!header || bodyRows <= 1;
          if (colDelete) colDelete.disabled = columns <= 1;
        }

        function removeTable(table) {
          const para = document.createElement("p");
          para.appendChild(placeholderBr());
          table.replaceWith(para);
          placeCaretAtStart(para);
        }

        function tableAction(action, cell) {
          const targetCell = cell || currentTableCell();
          if (!targetCell) return;
          const table = targetCell.closest("table");
          const row = targetCell.closest("tr");
          const editor = document.getElementById("live-editor");
          if (!table || !row || !editor) return;
          const before = captureHistoryState();
          const rows = Array.from(table.querySelectorAll("tr"));
          const index = Array.from(row.children).indexOf(targetCell);
          const headerRow = row.parentElement && row.parentElement.tagName === "THEAD";
          const bodyRows = Array.from(table.querySelectorAll("tbody tr"));
          const columns = row.children.length;
          const makeCell = (tag) => {
            const element = document.createElement(tag);
            element.appendChild(placeholderBr());
            return element;
          };
          const newRow = () => {
            const element = document.createElement("tr");
            for (let i = 0; i < columns; i += 1) element.appendChild(makeCell("td"));
            return element;
          };
          const addRowBelow = () => {
            if (headerRow) {
              let tbody = table.querySelector("tbody");
              if (!tbody) {
                tbody = document.createElement("tbody");
                table.appendChild(tbody);
              }
              const item = newRow();
              tbody.insertBefore(item, tbody.firstChild);
              setCaretIn(item.children[index] || item.firstChild);
            } else {
              const item = newRow();
              row.after(item);
              setCaretIn(item.children[index] || item.firstChild);
            }
          };
          const addRowAbove = () => {
            if (headerRow) return;
            const item = newRow();
            row.before(item);
            setCaretIn(item.children[index] || item.firstChild);
          };
          const addColumn = (right) => {
            rows.forEach((tr) => {
              const header = tr.parentElement && tr.parentElement.tagName === "THEAD";
              const cell = makeCell(header ? "th" : "td");
              const reference = tr.children[index];
              if (right) {
                if (reference) reference.after(cell);
                else tr.appendChild(cell);
              } else if (reference) {
                reference.before(cell);
              } else {
                tr.appendChild(cell);
              }
            });
            const focusIndex = right ? index + 1 : index;
            setCaretIn(row.children[focusIndex] || row.firstChild);
          };

          if (action === "row-add" || action === "row-below") {
            addRowBelow();
          } else if (action === "row-above") {
            addRowAbove();
          } else if (action === "col-add" || action === "col-right") {
            addColumn(true);
          } else if (action === "col-left") {
            addColumn(false);
          } else if (action === "row-del" || action === "row-delete") {
            if (headerRow || bodyRows.length <= 1) return;
            row.remove();
            const next = table.querySelector("tbody tr") || table.querySelector("tr");
            setCaretIn(next && next.children[index] ? next.children[index] : (next && next.firstChild));
          } else if (action === "col-del" || action === "col-delete") {
            if (columns <= 1) return;
            rows.forEach((tr) => {
              const target = tr.children[index];
              if (target) target.remove();
            });
            setCaretIn(row.children[Math.max(0, index - 1)] || row.firstChild);
          } else if (action === "row-up") {
            if (headerRow) return;
            const previous = row.previousElementSibling;
            if (!previous) return;
            previous.before(row);
            setCaretIn(row.children[index] || row.firstChild);
          } else if (action === "row-down") {
            if (headerRow) return;
            const next = row.nextElementSibling;
            if (!next) return;
            next.after(row);
            setCaretIn(row.children[index] || row.firstChild);
          } else if (action === "col-up") {
            if (index <= 0) return;
            rows.forEach((tr) => {
              const target = tr.children[index];
              const previous = tr.children[index - 1];
              if (target && previous) previous.before(target);
            });
            setCaretIn(row.children[index - 1] || row.firstChild);
          } else if (action === "col-down") {
            if (index >= columns - 1) return;
            rows.forEach((tr) => {
              const target = tr.children[index];
              const next = tr.children[index + 1];
              if (target && next) next.after(target);
            });
            setCaretIn(row.children[index + 1] || row.firstChild);
          } else if (action === "table-del" || action === "table-delete") {
            removeTable(table);
          }
          updateTableTools();
          liveSerialize(editor);
          recordProgrammatic(before);
        }

        function insertNodesAtCaret(nodes, caretTarget) {
          const editor = document.getElementById("live-editor");
          if (!editor || !nodes.length) return;
          const block = currentLiveBlock(editor);
          if (block && block.parentElement === editor && (block.tagName === "P" || block.tagName === "DIV") && !blockHasContent(block)) {
            block.replaceWith(...nodes);
          } else if (block) {
            let host = block;
            while (host.parentElement && host.parentElement !== editor) host = host.parentElement;
            let last = host;
            nodes.forEach((node) => { last.after(node); last = node; });
          } else {
            nodes.forEach((node) => editor.appendChild(node));
          }
          if (caretTarget) setCaretIn(caretTarget);
          else placeCaretAtStart(lastEditable(nodes[nodes.length - 1]));
          liveSerialize(editor);
          updateTableTools();
        }

        function parseTableLine(line) {
          return String(line || "").trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
        }

        // "| A | B |" followed by "| --- | :---: |" becomes a real table as
        // soon as the user presses Enter on the delimiter row.
        function buildTableFromRows(headerLine, delimiterLine) {
          const head = parseTableLine(headerLine);
          const aligns = parseTableLine(delimiterLine).map((cell) => {
            const left = cell.indexOf(":") === 0;
            const right = cell.lastIndexOf(":") === cell.length - 1 && cell.length > 1;
            if (left && right) return "center";
            if (right) return "right";
            if (left) return "left";
            return "";
          });
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const header = document.createElement("tr");
          head.forEach((title, index) => {
            const th = document.createElement("th");
            th.textContent = title;
            const align = aligns[index] || "";
            if (align) th.setAttribute("style", "text-align:" + align);
            header.appendChild(th);
          });
          thead.appendChild(header);
          table.appendChild(thead);
          const tbody = document.createElement("tbody");
          const row = document.createElement("tr");
          head.forEach(() => {
            const td = document.createElement("td");
            td.appendChild(placeholderBr());
            row.appendChild(td);
          });
          tbody.appendChild(row);
          table.appendChild(tbody);
          return table;
        }

        function createDefaultTable() {
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const headRow = document.createElement("tr");
          for (let i = 0; i < 3; i += 1) {
            const th = document.createElement("th");
            th.textContent = "列 " + (i + 1);
            headRow.appendChild(th);
          }
          thead.appendChild(headRow);
          table.appendChild(thead);
          const tbody = document.createElement("tbody");
          for (let r = 0; r < 2; r += 1) {
            const tr = document.createElement("tr");
            for (let c = 0; c < 3; c += 1) {
              const td = document.createElement("td");
              td.appendChild(placeholderBr());
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          table.appendChild(tbody);
          const para = document.createElement("p");
          para.appendChild(placeholderBr());
          return { nodes: [table, para], target: tbody.querySelector("td") };
        }

        function handleFormatAction(action) {
          const editor = document.getElementById("live-editor");
          if (!editor) return;
          if (action === "attach") { pickAttachments(); return; }
          const before = captureHistoryState();
          suppressHistory = true;
          editor.focus();
          if (/^h[1-6]$/.test(action) || action === "paragraph") {
            document.execCommand("formatBlock", false, action === "paragraph" ? "p" : action);
          } else if (action === "ul") {
            document.execCommand("insertUnorderedList");
          } else if (action === "ol") {
            document.execCommand("insertOrderedList");
          } else if (action === "task") {
            document.execCommand("insertHTML", false, '<ul><li class="task"><input type="checkbox"><span> </span></li></ul>');
            const items = editor.querySelectorAll("li.task span");
            if (items.length) placeCaretAtEnd(items[items.length - 1]);
          } else if (action === "quote") {
            document.execCommand("formatBlock", false, "blockquote");
          } else if (action === "codeblock") {
            document.execCommand("insertHTML", false, "<pre><code><br></code></pre><p><br></p>");
            const pres = editor.querySelectorAll("pre");
            const code = pres.length ? pres[pres.length - 1].querySelector("code") : null;
            if (code) placeCaretAtStart(code);
          } else if (action === "hr") {
            document.execCommand("insertHTML", false, "<hr><p><br></p>");
            const paras = editor.querySelectorAll("p");
            if (paras.length) placeCaretAtStart(paras[paras.length - 1]);
          } else if (action === "table") {
            const made = createDefaultTable();
            const holder = document.createElement("div");
            made.nodes.forEach((node) => holder.appendChild(node));
            document.execCommand("insertHTML", false, holder.innerHTML);
            const tables = editor.querySelectorAll("table");
            const table = tables.length ? tables[tables.length - 1] : null;
            const cell = table ? table.querySelector("tbody td") : null;
            if (cell) setCaretIn(cell);
          } else if (action === "bold") {
            document.execCommand("bold");
          } else if (action === "italic") {
            document.execCommand("italic");
          } else if (action === "strike") {
            document.execCommand("strikeThrough");
          } else if (action === "inlinecode") {
            insertInlineCode(editor);
          } else if (action === "link") {
            insertLiveLink(editor);
          }
          liveSerialize(editor);
          updateTableTools();
          setTimeout(() => { suppressHistory = false; }, 60);
          recordProgrammatic(before);
        }

        let ctxMenu = null;
        let ctxSub = null;
        let ctxCell = null;
        let ctxTarget = null;
        let ctxX = 0;
        let ctxY = 0;
        let ctxSubTimer = null;

        function cancelSubHide() {
          if (ctxSubTimer) {
            clearTimeout(ctxSubTimer);
            ctxSubTimer = null;
          }
        }

        function scheduleSubHide() {
          cancelSubHide();
          ctxSubTimer = setTimeout(() => {
            if (ctxSub) ctxSub.hidden = true;
            ctxSubTimer = null;
          }, 380);
        }

        function ensureContextMenu() {
          if (ctxMenu) return;
          ctxMenu = document.createElement("div");
          ctxMenu.className = "ctx-menu";
          ctxMenu.id = "ctx-menu";
          ctxMenu.hidden = true;
          document.body.appendChild(ctxMenu);
          ctxSub = document.createElement("div");
          ctxSub.className = "ctx-menu ctx-sub";
          ctxSub.id = "ctx-sub";
          ctxSub.hidden = true;
          document.body.appendChild(ctxSub);
          ctxMenu.addEventListener("mousedown", (event) => event.preventDefault());
          ctxSub.addEventListener("mousedown", (event) => event.preventDefault());
          ctxSub.addEventListener("mouseenter", cancelSubHide);
          ctxSub.addEventListener("mouseleave", scheduleSubHide);
          document.addEventListener("mousedown", (event) => {
            if (!ctxMenu || ctxMenu.hidden) return;
            if (ctxMenu.contains(event.target) || ctxSub.contains(event.target)) return;
            hideContextMenu();
          });
          document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideContextMenu(); });
          window.addEventListener("scroll", hideContextMenu, true);
          window.addEventListener("resize", hideContextMenu);
        }

        function hideContextMenu() {
          cancelSubHide();
          if (ctxMenu) ctxMenu.hidden = true;
          if (ctxSub) ctxSub.hidden = true;
        }

        function positionContextMenu() {
          if (!ctxMenu) return;
          const rect = ctxMenu.getBoundingClientRect();
          ctxMenu.style.left = Math.max(8, Math.min(ctxX, window.innerWidth - rect.width - 8)) + "px";
          ctxMenu.style.top = Math.max(8, Math.min(ctxY, window.innerHeight - rect.height - 8)) + "px";
        }

        function showSubMenu(item, anchor) {
          if (!ctxSub) return;
          ctxSub.innerHTML = "";
          item.children.forEach((child) => {
            const element = document.createElement("div");
            element.className = "ctx-item" + (child.disabled ? " disabled" : "");
            element.innerHTML = "<span>" + esc(child.label) + "</span>";
            element.addEventListener("click", () => {
              if (child.disabled) return;
              hideContextMenu();
              handleContextAction(child.action);
            });
            ctxSub.appendChild(element);
          });
          ctxSub.hidden = false;
          const rect = anchor.getBoundingClientRect();
          const subRect = ctxSub.getBoundingClientRect();
          let left = rect.right + 4;
          if (left + subRect.width > window.innerWidth - 8) left = rect.left - subRect.width - 4;
          let top = rect.top;
          if (top + subRect.height > window.innerHeight - 8) top = Math.max(8, window.innerHeight - subRect.height - 8);
          ctxSub.style.left = Math.max(8, left) + "px";
          ctxSub.style.top = Math.max(8, top) + "px";
        }

        function renderContextMenu(items) {
          if (!ctxMenu) return;
          ctxMenu.innerHTML = "";
          items.forEach((item) => {
            if (item.separator) {
              const separator = document.createElement("div");
              separator.className = "ctx-sep";
              ctxMenu.appendChild(separator);
              return;
            }
            const element = document.createElement("div");
            element.className = "ctx-item" + (item.disabled ? " disabled" : "");
            element.innerHTML = "<span>" + esc(item.label) + "</span>" + (item.children ? '<span class="ctx-arrow">›</span>' : "");
            if (item.children) {
              element.addEventListener("mouseenter", () => {
                cancelSubHide();
                showSubMenu(item, element);
              });
              element.addEventListener("mouseleave", scheduleSubHide);
            }
            element.addEventListener("click", () => {
              if (item.disabled) return;
              if (item.children) {
                cancelSubHide();
                showSubMenu(item, element);
              } else {
                hideContextMenu();
                handleContextAction(item.action);
              }
            });
            ctxMenu.appendChild(element);
          });
          positionContextMenu();
        }

        function showContextMenu(x, y, items, cell, target) {
          ensureContextMenu();
          ctxCell = cell || null;
          ctxTarget = target || null;
          ctxX = x;
          ctxY = y;
          ctxSub.hidden = true;
          ctxMenu.hidden = false;
          renderContextMenu(items);
        }

        function formatMenuItems() {
          const levels = ["一级标题", "二级标题", "三级标题", "四级标题", "五级标题", "六级标题"];
          return [
            { label: "正文", action: "paragraph" },
            { label: "文字格式", children: [
              { label: "加粗", action: "bold" },
              { label: "斜体", action: "italic" },
              { label: "删除线", action: "strike" },
              { label: "行内代码", action: "inlinecode" },
              { label: "链接", action: "link" }
            ] },
            { label: "标题", children: levels.map((label, index) => ({ label, action: "h" + (index + 1) })) },
            { label: "列表", children: [{ label: "无序列表", action: "ul" }, { label: "有序列表", action: "ol" }, { label: "任务列表", action: "task" }] },
            { label: "引用", action: "quote" },
            { label: "代码块", action: "codeblock" },
            { label: "分隔线", action: "hr" },
            { separator: true },
            { label: "表格", action: "table" },
            { label: "图片 / 文件", action: "attach" }
          ];
        }

        function tableMenuItems(cell) {
          const table = cell.closest("table");
          const row = cell.closest("tr");
          const bodyRows = Array.from(table.querySelectorAll("tbody tr"));
          const header = row.parentElement && row.parentElement.tagName === "THEAD";
          const columns = row.children.length;
          const index = Array.from(row.children).indexOf(cell);
          return [
            { label: "在上方插入行", action: "row-above", disabled: header },
            { label: "在下方插入行", action: "row-below" },
            { label: "在左侧插入列", action: "col-left" },
            { label: "在右侧插入列", action: "col-right" },
            { separator: true },
            { label: "上移一行", action: "row-up", disabled: header || !row.previousElementSibling },
            { label: "下移一行", action: "row-down", disabled: header || !row.nextElementSibling },
            { label: "左移一列", action: "col-up", disabled: index <= 0 },
            { label: "右移一列", action: "col-down", disabled: index >= columns - 1 },
            { separator: true },
            { label: "删除当前行", action: "row-delete", disabled: header || bodyRows.length <= 1 },
            { label: "删除当前列", action: "col-delete", disabled: columns <= 1 },
            { separator: true },
            { label: "删除表格", action: "table-delete" }
          ];
        }

        function handleContextAction(action) {
          const editor = document.getElementById("live-editor");
          if (action.indexOf("row-") === 0 || action.indexOf("col-") === 0 || action === "table-delete") {
            tableAction(action, ctxCell);
            return;
          }
          if (action === "image-delete") {
            if (ctxTarget) {
              ctxTarget.remove();
              if (editor) liveSerialize(editor);
            }
            return;
          }
          if (action === "link-edit") {
            if (ctxTarget) {
              const url = window.prompt(t("linkUrlPrompt"), ctxTarget.getAttribute("href") || "https://");
              if (url) {
                ctxTarget.setAttribute("href", url);
                if (editor) liveSerialize(editor);
              }
            }
            return;
          }
          if (action === "link-remove") {
            if (ctxTarget) {
              ctxTarget.replaceWith(document.createTextNode(ctxTarget.textContent || ""));
              if (editor) liveSerialize(editor);
            }
            return;
          }
          if (action === "hr-delete") {
            if (ctxTarget) {
              ctxTarget.remove();
              if (editor) liveSerialize(editor);
            }
            return;
          }
          if (action === "code-exit") {
            if (ctxTarget) {
              const para = document.createElement("p");
              para.appendChild(placeholderBr());
              ctxTarget.after(para);
              placeCaretAtStart(para);
              if (editor) liveSerialize(editor);
            }
            return;
          }
          if (action === "code-delete") {
            if (ctxTarget) {
              ctxTarget.remove();
              if (editor) liveSerialize(editor);
            }
            return;
          }
          if (action === "paragraph") {
            const block = editor ? currentLiveBlock(editor) : null;
            if (block && /^(P|DIV|H[1-6])$/.test(block.tagName)) {
              const para = document.createElement("p");
              para.innerHTML = block.innerHTML;
              if (!para.textContent.trim() && !para.querySelector("img, br")) para.appendChild(placeholderBr());
              block.replaceWith(para);
              placeCaretAtEnd(para);
            } else {
              const para = document.createElement("p");
              para.appendChild(placeholderBr());
              insertNodesAtCaret([para], para);
            }
            if (editor) liveSerialize(editor);
            return;
          }
          handleFormatAction(action);
        }

        let rowGrip = null;
        let colGrip = null;
        let gripDrag = null;
        let gripHideTimer = null;

        function clearTableDropMarks() {
          document.querySelectorAll(".drop-before, .drop-after").forEach((element) => element.classList.remove("drop-before", "drop-after"));
        }

        function cancelGripHide() {
          if (gripHideTimer) {
            clearTimeout(gripHideTimer);
            gripHideTimer = null;
          }
        }

        function scheduleGripHide() {
          cancelGripHide();
          gripHideTimer = setTimeout(() => {
            gripHideTimer = null;
            hideGrips();
          }, 600);
        }

        function hideGrips() {
          cancelGripHide();
          if (gripDrag) return;
          if (rowGrip) rowGrip.classList.remove("show", "dragging");
          if (colGrip) colGrip.classList.remove("show", "dragging");
          clearTableDropMarks();
        }

        function updateGrips(event) {
          const editor = document.getElementById("live-editor");
          if (!editor) return;
          if (gripDrag) return;
          clearTableDropMarks();
          ensureGrips();
          const target = event.target;
          if (target && (target === rowGrip || target === colGrip || (rowGrip && rowGrip.contains(target)) || (colGrip && colGrip.contains(target)))) {
            cancelGripHide();
            return;
          }
          const cell = target && target.closest ? target.closest("td, th") : null;
          if (!cell || !editor.contains(cell)) {
            const table = (rowGrip && rowGrip._table) || (colGrip && colGrip._table);
            if (table && table.isConnected) {
              const rect = table.getBoundingClientRect();
              const near = event.clientX >= rect.left - 60 && event.clientX <= rect.right + 60 && event.clientY >= rect.top - 60 && event.clientY <= rect.bottom + 60;
              if (near) {
                cancelGripHide();
                return;
              }
            }
            scheduleGripHide();
            return;
          }
          cancelGripHide();
          const row = cell.closest("tr");
          const table = cell.closest("table");
          if (!table) { hideGrips(); return; }
          const tableRect = table.getBoundingClientRect();
          const rowRect = row.getBoundingClientRect();
          const cellRect = cell.getBoundingClientRect();
          if (row.parentElement && row.parentElement.tagName !== "THEAD") {
            rowGrip._row = row;
            rowGrip._table = table;
            rowGrip.classList.add("show");
            rowGrip.style.left = Math.max(4, tableRect.left - 28) + "px";
            rowGrip.style.top = (rowRect.top + rowRect.height / 2 - 15) + "px";
          } else {
            rowGrip.classList.remove("show");
          }
          colGrip._cell = cell;
          colGrip._table = table;
          colGrip.classList.add("show");
          colGrip.style.left = (cellRect.left + cellRect.width / 2 - 13) + "px";
          colGrip.style.top = Math.max(4, tableRect.top - 32) + "px";
        }

        function bindGrip(grip, type) {
          grip.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            const row = grip._row;
            const cell = grip._cell;
            const table = grip._table;
            if (!table) return;
            if (type === "row" && (!row || (row.parentElement && row.parentElement.tagName === "THEAD"))) return;
            if (type === "col" && !cell) return;
            gripDrag = { type, row, cell, table, target: null, targetIndex: undefined, after: false };
            grip.classList.add("dragging");
            document.body.classList.add("table-dragging");
            try { grip.setPointerCapture(event.pointerId); } catch (_) {}
            const onMove = (moveEvent) => {
              const element = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
              const targetCell = element && element.closest ? element.closest("td, th") : null;
              if (!targetCell) return;
              clearTableDropMarks();
              if (type === "row") {
                const targetRow = targetCell.closest("tr");
                if (!targetRow || targetRow === row) return;
                if (targetRow.parentElement && targetRow.parentElement.tagName === "THEAD") return;
                const rect = targetRow.getBoundingClientRect();
                const after = moveEvent.clientY >= rect.top + rect.height / 2;
                targetRow.classList.add(after ? "drop-after" : "drop-before");
                gripDrag.target = targetRow;
                gripDrag.after = after;
              } else {
                const targetRow = targetCell.closest("tr");
                const targetIndex = Array.from(targetRow.children).indexOf(targetCell);
                const sourceIndex = Array.from(cell.parentElement.children).indexOf(cell);
                if (targetIndex === sourceIndex) return;
                const rect = targetCell.getBoundingClientRect();
                const after = moveEvent.clientX >= rect.left + rect.width / 2;
                targetCell.classList.add(after ? "drop-after" : "drop-before");
                gripDrag.targetIndex = targetIndex;
                gripDrag.after = after;
              }
            };
            const onUp = () => {
              document.removeEventListener("pointermove", onMove);
              document.removeEventListener("pointerup", onUp);
              grip.classList.remove("dragging");
              const editor = document.getElementById("live-editor");
              const beforeDrag = captureHistoryState();
              if (type === "row" && gripDrag.target && gripDrag.target !== row) {
                if (gripDrag.after) gripDrag.target.after(row);
                else gripDrag.target.before(row);
              } else if (type === "col" && gripDrag.targetIndex !== undefined) {
                const sourceIndex = Array.from(cell.parentElement.children).indexOf(cell);
                table.querySelectorAll("tr").forEach((tr) => {
                  const source = tr.children[sourceIndex];
                  const target = tr.children[gripDrag.targetIndex];
                  if (!source || !target) return;
                  if (gripDrag.after) target.after(source);
                  else target.before(source);
                });
              }
              gripDrag = null;
              document.body.classList.remove("table-dragging");
              clearTableDropMarks();
              hideGrips();
              if (editor) liveSerialize(editor);
              updateTableTools();
              recordProgrammatic(beforeDrag);
            };
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
          });
        }

        function ensureGrips() {
          if (rowGrip) return;
          rowGrip = document.createElement("div");
          rowGrip.className = "table-grip row-grip";
          rowGrip.textContent = "⋮";
          rowGrip.title = "拖动行";
          document.body.appendChild(rowGrip);
          colGrip = document.createElement("div");
          colGrip.className = "table-grip col-grip";
          colGrip.textContent = "⋯";
          colGrip.title = "拖动列";
          document.body.appendChild(colGrip);
          bindGrip(rowGrip, "row");
          bindGrip(colGrip, "col");
          rowGrip.addEventListener("mouseenter", cancelGripHide);
          rowGrip.addEventListener("mouseleave", scheduleGripHide);
          colGrip.addEventListener("mouseenter", cancelGripHide);
          colGrip.addEventListener("mouseleave", scheduleGripHide);
          document.addEventListener("mousemove", updateGrips);
          document.addEventListener("pointerup", () => {
            if (!gripDrag) {
              document.body.classList.remove("table-dragging");
              clearTableDropMarks();
            }
          });
          document.addEventListener("pointercancel", () => {
            gripDrag = null;
            document.body.classList.remove("table-dragging");
            clearTableDropMarks();
            hideGrips();
          });
          window.addEventListener("scroll", hideGrips, true);
        }

        function bindLiveEditor(editor) {
          ensureGrips();
          editor.addEventListener("input", onLiveInput);
          editor.addEventListener("keydown", onLiveKeydown);
          editor.addEventListener("compositionstart", () => { liveComposing = true; });
          editor.addEventListener("compositionend", () => {
            liveComposing = false;
            onLiveInput({ currentTarget: editor });
          });
          editor.addEventListener("paste", (event) => {
            const data = event.clipboardData;
            if (!data) return;
            let files = Array.from(data.files || []);
            if (!files.length) files = Array.from(data.items || []).filter((item) => item.kind === "file").map((item) => item.getAsFile()).filter(Boolean);
            if (files.length) {
              event.preventDefault();
              handleAttachmentFiles(files);
              return;
            }
            const text = data.getData("text/plain");
            if (text) {
              event.preventDefault();
              if (looksLikeMarkdownBlocks(text)) {
                insertMarkdownBlocks(editor, text);
              } else {
                const before = captureHistoryState();
                suppressHistory = true;
                document.execCommand("insertText", false, text);
                onLiveInput({ currentTarget: editor });
                setTimeout(() => { suppressHistory = false; }, 60);
                recordProgrammatic(before);
              }
            }
          });
          editor.addEventListener("copy", (event) => {
            const selection = window.getSelection();
            if (!selection || !selection.rangeCount || selection.isCollapsed) return;
            const holder = document.createElement("div");
            holder.appendChild(selection.getRangeAt(0).cloneContents());
            const hasBlock = Array.from(holder.childNodes).some((node) => node.nodeType === 1 && /^(P|DIV|H[1-6]|UL|OL|BLOCKQUOTE|PRE|TABLE|HR)$/.test(node.tagName));
            if (!hasBlock) return;
            const markdown = htmlToMarkdown(holder);
            if (!markdown) return;
            event.clipboardData.setData("text/plain", markdown);
            event.preventDefault();
          });
          editor.addEventListener("click", (event) => {
            const link = event.target.closest && event.target.closest("a");
            if (link && !event.metaKey && !event.ctrlKey) event.preventDefault();
            updateTableTools();
          });
          editor.addEventListener("keyup", () => updateTableTools());
          editor.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            const cell = event.target.closest && event.target.closest("td, th");
            const currentSelection = window.getSelection();
            if ((!currentSelection || currentSelection.isCollapsed) && document.caretRangeFromPoint) {
              const range = document.caretRangeFromPoint(event.clientX, event.clientY);
              if (range && editor.contains(range.startContainer)) {
                currentSelection.removeAllRanges();
                currentSelection.addRange(range);
              }
            }
            const image = event.target.closest && event.target.closest("img");
            const link = event.target.closest && event.target.closest("a");
            const hr = event.target.closest && event.target.closest("hr");
            const pre = event.target.closest && event.target.closest("pre");
            if (cell && editor.contains(cell)) {
              showContextMenu(event.clientX, event.clientY, tableMenuItems(cell), cell);
            } else if (image) {
              showContextMenu(event.clientX, event.clientY, [{ label: "删除图片", action: "image-delete" }], null, image);
            } else if (link) {
              const items = [];
              if (!link.dataset.attachmentId) items.push({ label: "修改链接", action: "link-edit" });
              items.push({ label: "取消链接", action: "link-remove" });
              showContextMenu(event.clientX, event.clientY, items, null, link);
            } else if (hr) {
              showContextMenu(event.clientX, event.clientY, [{ label: "删除分隔线", action: "hr-delete" }], null, hr);
            } else if (pre) {
              showContextMenu(event.clientX, event.clientY, [{ label: "退出代码块", action: "code-exit" }, { label: "删除代码块", action: "code-delete" }], null, pre);
            } else {
              showContextMenu(event.clientX, event.clientY, formatMenuItems(), null);
            }
          });
          editor.addEventListener("dragover", (event) => event.preventDefault());
          editor.addEventListener("drop", (event) => {
            const files = event.dataTransfer && event.dataTransfer.files;
            if (files && files.length) {
              event.preventDefault();
              handleAttachmentFiles(files);
            }
          });
          editor.addEventListener("change", () => liveSerialize(editor));
        }

        function renderLiveEditor(editor, note) {
          resetHistory();
          const token = ++liveRenderToken;
          const body = note.body || "";
          const ids = Array.from(new Set(Array.from(body.matchAll(/attachment:([A-Za-z0-9-]+)/g)).map((match) => match[1])));
          const source = body.replace(/attachment:([A-Za-z0-9-]+)/g, "dbx-attachment:$1");
          editor.innerHTML = source.trim() ? markdownToHtml(source) : "<p><br></p>";
          editor.querySelectorAll("p, h1, h2, h3, h4, h5, h6, li").forEach((block) => {
            if (!block.textContent.trim()) {
              Array.from(block.children).forEach((child) => {
                if (child.tagName === "BR") child.dataset.placeholder = "1";
              });
            }
          });
          editor.querySelectorAll('li.task input[type="checkbox"]').forEach((box) => { box.disabled = false; });
          lastHistoryState = captureHistoryState();
          if (!ids.length) return;
          loadAttachmentMap(ids).then((map) => {
            if (token !== liveRenderToken || !editor.isConnected) return;
            editor.querySelectorAll('img[src^="dbx-attachment:"]').forEach((img) => {
              const id = img.getAttribute("src").slice("dbx-attachment:".length);
              const url = map[id];
              if (url) {
                img.src = url;
                img.dataset.attachmentId = id;
              } else {
                const link = document.createElement("a");
                link.href = "#";
                link.dataset.attachmentId = id;
                link.dataset.attachmentName = img.getAttribute("alt") || "file";
                link.textContent = img.getAttribute("alt") || "file";
                img.replaceWith(link);
              }
            });
            editor.querySelectorAll('a[data-download-url^="dbx-attachment:"]').forEach((link) => {
              const id = link.getAttribute("data-download-url").slice("dbx-attachment:".length);
              link.removeAttribute("data-download-url");
              link.setAttribute("data-attachment-id", id);
              link.setAttribute("data-attachment-name", link.textContent || "");
            });
            lastHistoryState = captureHistoryState();
          });
        }

        // ---------------------------------------------------------------
        // Sidebar rendering
        // ---------------------------------------------------------------
        function noteById(id) { return vault.notes.find((note) => note.id === id) || null; }
        function activeNotes() { return vault.notes.filter((note) => !note.deletedAt && note.id !== welcomeId && note.id !== "note-welcome"); }
        function trashedNotes() { return vault.notes.filter((note) => note.deletedAt); }
        function sortSiblings(a, b) { return a.order - b.order || b.updatedAt - a.updatedAt; }

        function matchesQuery(note, needle) {
          if (!needle) return true;
          const haystack = (note.title + "\n" + note.body + "\n" + note.tags.join(" ")).toLowerCase();
          return haystack.indexOf(needle) !== -1;
        }

        function filteredRoots() {
          const needle = query.trim().toLowerCase();
          const source = filter === "trash" ? trashedNotes() : activeNotes().filter((note) => filter !== "fav" || note.favorite);
          const matched = source.filter((note) => matchesQuery(note, needle));
          if (needle) return { flat: matched.sort((a, b) => b.updatedAt - a.updatedAt), children: null };
          const ids = new Set(matched.map((note) => note.id));
          const roots = matched.filter((note) => !note.parentId || !ids.has(note.parentId)).sort(sortSiblings);
          const children = new Map();
          matched.forEach((note) => {
            if (note.parentId) {
              if (!children.has(note.parentId)) children.set(note.parentId, []);
              children.get(note.parentId).push(note);
            }
          });
          children.forEach((list) => list.sort(sortSiblings));
          return { flat: null, children: children, roots: roots };
        }

        function pageRow(note, depth, hasChildren) {
          const selected = note.id === selectedId;
          const isCollapsed = collapsed.has(note.id);
          const title = note.title || t("untitled");
          const starClass = note.favorite ? " star-on" : "";
          const inTrash = filter === "trash";
          const draggable = "";
          const rowIcon = note.icon ? '<span class="row-emoji">' + esc(note.icon) + "</span>" : icon("file");
          return '<div class="page-row' + (selected ? " selected" : "") + (dirty && selected ? " dirty" : "") + '" data-id="' + esc(note.id) + '"' + draggable + ' style="padding-left:' + (3 + depth * 13) + 'px" role="treeitem" aria-selected="' + selected + '">' +
            '<button class="chev ' + (hasChildren ? (isCollapsed ? "" : "open") : "leaf") + '" data-action="toggle" data-id="' + esc(note.id) + '" aria-label="' + esc(t("toggle")) + '">' + icon("chevron") + "</button>" +
            '<span class="page-icon">' + rowIcon + "</span>" +
            '<span class="page-title">' + esc(title) + "</span>" +
            '<span class="row-actions">' +
              (inTrash
                ? '<button class="icon-btn" data-action="restore" data-id="' + esc(note.id) + '" title="' + esc(t("restore")) + '">' + icon("restore") + "</button>" +
                  '<button class="icon-btn" data-action="purge" data-id="' + esc(note.id) + '" title="' + esc(t("deleteForever")) + '">' + icon("trash") + "</button>"
                : '<button class="icon-btn star-btn' + starClass + '" data-action="star" data-id="' + esc(note.id) + '" title="' + esc(t(note.favorite ? "unfavorite" : "favorite")) + '">' + icon("star") + "</button>" +
                  '<button class="icon-btn" data-action="child" data-id="' + esc(note.id) + '" title="' + esc(t("createChild")) + '">' + icon("plus") + "</button>" +
                  '<button class="icon-btn" data-action="menu" data-id="' + esc(note.id) + '" title="' + esc(t("more")) + '">' + icon("more") + "</button>") +
            "</span>" +
            '<span class="badge-dot"></span>' +
            "</div>";
        }

        function renderTree() {
          const data = filteredRoots();
          if (data.flat) {
            if (!data.flat.length) { els.tree.innerHTML = emptyTree("noResults", "noResultsHint"); return; }
            els.tree.innerHTML = data.flat.map((note) => pageRow(note, 0, false)).join("");
            return;
          }
          if (!data.roots.length) {
            const key = filter === "trash" ? ["emptyTrash", "emptyTrashHint"] : filter === "fav" ? ["emptyFav", "emptyFavHint"] : ["noNotes", "noNotesHint"];
            els.tree.innerHTML = emptyTree(key[0], key[1]);
            return;
          }
          const html = [];
          const walk = (note, depth) => {
            const kids = data.children.get(note.id) || [];
            html.push(pageRow(note, depth, kids.length > 0));
            if (kids.length && !collapsed.has(note.id)) kids.forEach((child) => walk(child, depth + 1));
          };
          data.roots.forEach((note) => walk(note, 0));
          els.tree.innerHTML = html.join("");
        }

        function emptyTree(titleKey, hintKey) {
          return '<div class="tree-empty"><div style="font-size:13px;font-weight:600;color:var(--muted)">' + esc(t(titleKey)) + "</div><div>" + esc(t(hintKey)) + "</div></div>";
        }

        function renderNav() {
          document.getElementById("count-all").textContent = String(activeNotes().length);
          document.getElementById("count-fav").textContent = String(activeNotes().filter((note) => note.favorite).length);
          document.getElementById("count-trash").textContent = String(trashedNotes().length);
          document.querySelectorAll("#nav button").forEach((button) => {
            button.classList.toggle("active", button.dataset.filter === filter);
          });
        }

        function tabKeyFor(id) {
          return (id === welcomeId || id === "note-welcome") ? HOME_TAB : id;
        }

        function persistTabs() {
          writePref("tabs", JSON.stringify(openTabs));
          writePref("tabLayout", tabLayout);
        }

        // Keep only tabs that still exist, and always keep the active one.
        function sanitizeTabs() {
          const valid = new Set([HOME_TAB]);
          activeNotes().forEach((note) => valid.add(note.id));
          openTabs = openTabs.filter((id) => valid.has(id));
          const current = tabKeyFor(selectedId);
          if (current && !openTabs.includes(current)) openTabs.push(current);
          persistTabs();
        }

        function ensureTab(id) {
          if (!id || openTabs.includes(id)) return;
          openTabs.push(id);
          persistTabs();
        }

        function renderTabs() {
          const bar = document.getElementById("tabbar");
          if (!bar) return;
          bar.classList.toggle("multi", tabLayout === "multi");
          const activeKey = tabKeyFor(selectedId);
          const html = openTabs.map((id) => {
            if (id === HOME_TAB) {
              return '<div class="tab' + (id === activeKey ? " active" : "") + '" data-action="tab-select" data-tab="' + HOME_TAB + '" role="tab">' +
                '<span class="tab-icon">🏠</span><span class="tab-title">' + esc(t("home")) + "</span>" +
                '<button class="tab-close" data-action="tab-close" data-tab="' + HOME_TAB + '" title="' + esc(t("tabClose")) + '">' + icon("close") + "</button></div>";
            }
            const note = noteById(id);
            if (!note || note.deletedAt) return "";
            return '<div class="tab' + (id === activeKey ? " active" : "") + '" data-action="tab-select" data-tab="' + esc(id) + '" role="tab">' +
              '<span class="tab-icon">' + esc(note.icon || "📄") + "</span>" +
              '<span class="tab-title">' + esc(note.title || t("untitled")) + "</span>" +
              (id === activeKey && dirty ? '<span class="tab-dot"></span>' : "") +
              '<button class="tab-close" data-action="tab-close" data-tab="' + esc(id) + '" title="' + esc(t("tabClose")) + '">' + icon("close") + "</button></div>";
          }).filter(Boolean).join("");
          const toggleTitle = tabLayout === "single" ? t("tabMulti") : t("tabSingle");
          bar.innerHTML = html + '<button class="icon-btn tab-layout" data-action="tab-layout" title="' + esc(toggleTitle) + '" aria-label="' + esc(toggleTitle) + '">' + icon("menu") + "</button>";
        }

        async function activateTab(id) {
          if (id === HOME_TAB) { await selectWelcome(); return; }
          if (id === selectedId) return;
          await selectNote(id);
        }

        async function closeTab(id) {
          if (!(await saveNow(false))) return;
          const index = openTabs.indexOf(id);
          if (index < 0) return;
          openTabs.splice(index, 1);
          if (tabKeyFor(selectedId) === id) {
            const next = openTabs[index] || openTabs[index - 1] || "";
            if (next === HOME_TAB) {
              await selectWelcome();
            } else if (next) {
              selectedId = next;
              writePref("selected", next);
              renderChrome();
              renderTree();
              renderMain();
            } else {
              selectedId = "";
              writePref("selected", "");
              renderChrome();
              renderTree();
              renderMain();
            }
          }
          persistTabs();
          renderTabs();
        }

        function toggleTabLayout() {
          tabLayout = tabLayout === "single" ? "multi" : "single";
          persistTabs();
          renderTabs();
          toast(tabLayout === "single" ? t("tabSingle") : t("tabMulti"), "ok");
        }

        function renderChrome() {
          document.documentElement.lang = locale;
          document.getElementById("vault-name").textContent = vault.name || "DBX Notes";
          document.getElementById("vault-sub").textContent = settings.mode === "none" ? t("vault") : settings.mode.toUpperCase();
          const settingsButton = document.getElementById("settings-btn");
          settingsButton.title = t("settings");
          settingsButton.setAttribute("aria-label", t("settings"));
          document.getElementById("search").placeholder = t("search");
          document.getElementById("search-kbd").textContent = isMac ? "⌘K" : "Ctrl+K";
          document.getElementById("new-page-label").textContent = t("newPage");
          const homeButton = document.getElementById("home-btn");
          homeButton.title = t("openHome");
          homeButton.setAttribute("aria-label", t("openHome"));
          homeButton.classList.toggle("on", selectedId === welcomeId || selectedId === "note-welcome");
          applySidebar();
          document.getElementById("nav-all").textContent = t("all");
          document.getElementById("nav-fav").textContent = t("starred");
          document.getElementById("nav-trash").textContent = t("trash");
          document.getElementById("sync-now").textContent = t("syncNow");
          renderNav();
          renderSyncLine();
          renderTabs();
        }

        function renderSyncLine() {
          const dot = document.getElementById("sync-dot");
          const label = document.getElementById("sync-label");
          const mode = document.getElementById("sync-mode");
          const time = document.getElementById("sync-time");
          const button = document.getElementById("sync-now");
          mode.textContent = settings.mode === "none" ? t("localChip") : settings.mode.toUpperCase();
          dot.className = "dot";
          if (syncing) {
            dot.classList.add("busy");
            label.textContent = t("syncing");
          } else if (settings.mode === "none") {
            label.textContent = t("localOnly");
          } else if (sync.lastResult && /fail|error|失败|failed/i.test(sync.lastResult)) {
            dot.classList.add("err");
            label.textContent = t("syncError");
          } else if (!settings.configured) {
            dot.classList.add("warn");
            label.textContent = t("syncNotConfigured");
          } else if (sync.lastSyncAt) {
            dot.classList.add("ok");
            label.textContent = t("syncReady");
          } else {
            dot.classList.add("warn");
            label.textContent = t("notSyncedYet");
          }
          time.textContent = settings.mode === "none"
            ? t("localHint")
            : (sync.lastSyncAt ? t("lastSync") + " " + timeAgo(sync.lastSyncAt) : t("neverSynced"));
          button.style.display = settings.mode === "none" ? "none" : "";
          button.disabled = settings.mode === "none" || syncing;
        }

        // ---------------------------------------------------------------
        // Main rendering
        // ---------------------------------------------------------------
        function selectedNote() {
          const note = noteById(selectedId);
          return note && !note.deletedAt ? note : null;
        }

        function ancestors(note) {
          const list = [];
          let current = note;
          let guard = 0;
          while (current && current.parentId && guard++ < 64) {
            const parent = noteById(current.parentId);
            if (!parent) break;
            list.unshift(parent);

        async function loadAttachmentMap(ids) {
          const map = {};
          await Promise.all(ids.map(async (id) => {
            if (attachmentCache.has(id)) { map[id] = attachmentCache.get(id); return; }
            try {
              const result = await rpc("attachments/get", { id: id, maxBytes: 8 * 1024 * 1024 });
              if (result && result.dataBase64) {
                const mime = (result.attachment && result.attachment.mime) || "application/octet-stream";
                const url = "data:" + mime + ";base64," + result.dataBase64;
                attachmentCache.set(id, url);
                map[id] = url;
              } else {
                attachmentCache.set(id, null);
                map[id] = null;
              }
            } catch (_) {
              map[id] = null;
            }
          }));
          return map;
        }

        async function renderPreviewSource(body) {
          const token = ++previewToken;
          const preview = document.getElementById("preview");
          if (!preview) return;
          const previousTop = preview.scrollTop;
          const previousMax = Math.max(0, preview.scrollHeight - preview.clientHeight);
          const ids = Array.from(new Set(Array.from(body.matchAll(/attachment:([A-Za-z0-9-]+)/g)).map((match) => match[1])));
          const map = ids.length ? await loadAttachmentMap(ids) : {};
          if (token !== previewToken) return;
          let source = body;
          ids.forEach((id) => {
            const url = map[id];
            if (url) {
              source = source.replace(new RegExp("attachment:" + id + "(?![A-Za-z0-9-])", "g"), url);
            } else {
              source = source.replace(new RegExp("!\\[([^\\]]*)\\]\\(attachment:" + id + "\\)", "g"), "[$1](attachment:" + id + ")");
            }
          });
          preview.innerHTML = source.trim() ? markdownToHtml(source) : '<p class="empty-hint">' + esc(t("bodyPlaceholder")) + "</p>";
          if (previousMax > 0) {
            const max = Math.max(0, preview.scrollHeight - preview.clientHeight);
            preview.scrollTop = (previousTop / previousMax) * max;
          }
        }

        function mimeFor(name, type) {
          if (type) return type;
          const ext = String(name || "").split(".").pop().toLowerCase();
          return { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", svg: "image/svg+xml" }[ext] || "application/octet-stream";
        }

        function defaultAttachmentName(name, mime) {
          if (name && name.trim()) return name.trim();
          const count = (vault.attachments ? vault.attachments.length : 0) + 1;
          return (String(mime || "").indexOf("image/") === 0 ? t("imageAlt") : "file") + count;
        }

        function insertAttachmentMarkdown(attachment) {
          if (!attachment) return;
          const mime = mimeFor(attachment.name, attachment.mime);
          const name = String(attachment.name || defaultAttachmentName("", mime)).replace(/[\[\]()]/g, "");
          const image = String(mime).indexOf("image/") === 0;
          if (!vault.attachments) vault.attachments = [];
          if (!vault.attachments.some((item) => item.id === attachment.id)) vault.attachments.push(attachment);
          const live = document.getElementById("live-editor");
          if (live) insertAttachmentNode(live, attachment, image, name);
          else insertAtCursor((image ? "!" : "") + "[" + name + "](attachment:" + attachment.id + ")\n");
          if (settings.mode !== "none" && settings.configured) {
            clearTimeout(attachmentSyncTimer);
            attachmentSyncTimer = setTimeout(() => { syncNow(true); }, 1800);
          }
        }

        async function insertAttachmentNode(editor, attachment, image, name) {
          let url = null;
          if (image) {
            url = attachmentCache.get(attachment.id) || null;
            if (!url) {
              try {
                const result = await rpc("attachments/get", { id: attachment.id, maxBytes: 8 * 1024 * 1024 });
                if (result && result.dataBase64) {
                  const mime = (result.attachment && result.attachment.mime) || attachment.mime || "application/octet-stream";
                  url = "data:" + mime + ";base64," + result.dataBase64;
                  attachmentCache.set(attachment.id, url);
                }
              } catch (_) {}
            }
          }
          if (!editor.isConnected) return;
          const before = captureHistoryState();
          editor.focus();
          const selection = window.getSelection();
          let range;
          if (selection && selection.rangeCount && editor.contains(selection.anchorNode)) {
            range = selection.getRangeAt(0);
            range.deleteContents();
          } else {
            range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
          }
          let node;
          if (image && url) {
            node = document.createElement("img");
            node.src = url;
            node.alt = name;
            node.dataset.attachmentId = attachment.id;
          } else {
            node = document.createElement("a");
            node.href = "#";
            node.dataset.attachmentId = attachment.id;
            node.dataset.attachmentName = name;
            node.textContent = name;
          }
          range.insertNode(node);
          const after = document.createRange();
          after.setStartAfter(node);
          after.collapse(true);
          if (selection) {
            selection.removeAllRanges();
            selection.addRange(after);
          }
          liveSerialize(editor);
          recordProgrammatic(before);
        }

        async function uploadFileObject(file) {
          const name = file.name || "";
          const mime = mimeFor(name, file.type);
          const begin = await rpc("attachments/begin", { name: defaultAttachmentName(name, mime), mime: mime, size: file.size });
          const uploadId = begin.uploadId;
          try {
            const chunkSize = 2 * 1024 * 1024;
            let offset = 0;
            while (offset < file.size) {
              const slice = file.slice(offset, offset + chunkSize);
              const buffer = await slice.arrayBuffer();
              await rpc("attachments/chunk", { uploadId: uploadId, offset: offset, dataBase64: bytesToBase64(new Uint8Array(buffer)) });
              offset += buffer.byteLength;
            }
            const result = await rpc("attachments/finish", { uploadId: uploadId });
            insertAttachmentMarkdown(result.attachment);
          } catch (error) {
            try { await rpc("attachments/cancel", { uploadId: uploadId }); } catch (_) {}
            throw error;
          }
        }

        async function uploadTransferFile(file, transfer) {
          const name = file.name || "";
          const mime = mimeFor(name, file.type);
          const size = Number(file.size) || 0;
          const begin = await rpc("attachments/begin", { name: defaultAttachmentName(name, mime), mime: mime, size: size });
          const uploadId = begin.uploadId;
          try {
            const chunkSize = 2 * 1024 * 1024;
            let offset = 0;
            for (;;) {
              const chunk = await transfer.read(file.handleId, offset, chunkSize);
              if (chunk.length > 0) {
                await rpc("attachments/chunk", { uploadId: uploadId, offset: offset, dataBase64: chunk.dataBase64 });
                offset += chunk.length;
              }
              if (chunk.eof) break;
              if (chunk.length === 0) break;
            }
            const result = await rpc("attachments/finish", { uploadId: uploadId });
            insertAttachmentMarkdown(result.attachment);
          } catch (error) {
            try { await rpc("attachments/cancel", { uploadId: uploadId }); } catch (_) {}
            throw error;
          } finally {
            if (typeof transfer.cancel === "function") {
              try { await transfer.cancel(file.handleId); } catch (_) {}
            }
          }
        }

        async function handleAttachmentFiles(files) {
          const list = Array.from(files || []);
          if (!list.length) return;
          for (const file of list) {
            try {
              await uploadFileObject(file);
            } catch (error) {
              toast(t("fileFailed") + ": " + errorText(error), "err");
            }
          }
        }

        async function pickAttachments() {
          const transfer = host && host.fileTransfer;
          if (transfer && typeof transfer.pick === "function" && typeof transfer.read === "function") {
            try {
              const result = await transfer.pick({ multiple: true });
              const files = (result && result.files) || [];
              if (!files.length) return;
              for (const file of files) {
                try {
                  await uploadTransferFile(file, transfer);
                } catch (error) {
                  toast(t("fileFailed") + ": " + errorText(error), "err");
                }
              }
              return;
            } catch (_) {
              // Fall through to the browser file input.
            }
          }
          const input = document.createElement("input");
          input.type = "file";
          input.multiple = true;
          input.style.display = "none";
          input.addEventListener("change", () => {
            if (input.files && input.files.length) handleAttachmentFiles(input.files);
            input.remove();
          });
          document.body.appendChild(input);
          input.click();
        }

        function base64ToBytes(value) {
          const binary = atob(value || "");
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
          return bytes;
        }

        function bytesToBase64(bytes) {
          let binary = "";
          const step = 0x8000;
          for (let index = 0; index < bytes.length; index += step) {
            binary += String.fromCharCode.apply(null, bytes.subarray(index, index + step));
          }
          return btoa(binary);
        }

        function dataUrlToBytes(url) {
          const comma = url.indexOf(",");
          if (comma < 0) return new Uint8Array();
          const meta = url.slice(0, comma);
          const payload = url.slice(comma + 1);
          if (meta.indexOf(";base64") !== -1) return base64ToBytes(payload);
          return new TextEncoder().encode(decodeURIComponent(payload));
        }

        async function saveBytes(name, bytes) {
          const transfer = host && host.fileTransfer;
          if (transfer && typeof transfer.beginSave === "function") {
            try {
              const target = await transfer.beginSave({ name: name || "download", size: bytes.byteLength });
              if (!target) return;
              await transfer.write(target.handleId, 0, bytes);
              await transfer.finish(target.handleId);
              toast(t("downloaded"), "ok");
              return;
            } catch (_) {}
          }
          try {
            const blob = new Blob([bytes], { type: "application/octet-stream" });
            const objectUrl = URL.createObjectURL(blob);
            const anchor = document.createElement("a");
            anchor.href = objectUrl;
            anchor.download = name || "download";
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(objectUrl), 2000);
            toast(t("downloaded"), "ok");
          } catch (error) {
            toast(t("downloadFailed") + ": " + (error.message || error), "err");
          }
        }

        async function downloadDataUrl(name, url) {
          await saveBytes(name, dataUrlToBytes(url));
        }

        async function downloadAttachment(id, name) {
          try {
            const chunks = [];
            let offset = 0;
            for (;;) {
              const result = await rpc("attachments/read", { id: id, offset: offset, length: 1024 * 1024 });
              chunks.push(base64ToBytes(result.dataBase64));
              offset += Number(result.length) || 0;
              if (result.eof) break;
              if (!result.length) break;
            }
            const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
            const bytes = new Uint8Array(total);
            let position = 0;
            chunks.forEach((chunk) => { bytes.set(chunk, position); position += chunk.length; });
            await saveBytes(name || "download", bytes);
          } catch (error) {
            toast(t("downloadFailed") + ": " + (error.message || error), "err");
          }
        }

        function fitEditorHeight(editor) {
          if (!editor) return;
          if (editor.closest(".doc.split-mode") && window.matchMedia("(min-width: 761px)").matches) {
            editor.style.height = "";
            return;
          }
          editor.style.height = "auto";
          editor.style.height = editor.scrollHeight + "px";
        }

        function bindScrollSync() {
          const editor = document.getElementById("editor");
          const preview = document.getElementById("preview");
          const doc = document.getElementById("doc");
          if (!editor || !preview || !doc || !doc.classList.contains("split-mode")) return;
          if (!window.matchMedia("(min-width: 761px)").matches) return;
          // Only the pane the user is actually scrolling drives the sync. Programmatic
          // scrollTop changes on the other pane then cannot echo back and start a loop.
          let active = null;
          const expected = new WeakMap();
          const mark = (pane) => { active = pane; };
          const markEditor = () => mark(editor);
          const markPreview = () => mark(preview);
          editor.addEventListener("pointerenter", markEditor);
          editor.addEventListener("pointerdown", markEditor);
          editor.addEventListener("focus", markEditor);
          editor.addEventListener("wheel", markEditor, { passive: true });
          preview.addEventListener("pointerenter", markPreview);
          preview.addEventListener("pointerdown", markPreview);
          preview.addEventListener("wheel", markPreview, { passive: true });
          const sync = (from, to) => {
            if (active !== from) return;
            const fromMax = Math.max(0, from.scrollHeight - from.clientHeight);
            const toMax = Math.max(0, to.scrollHeight - to.clientHeight);
            const ratio = fromMax > 0 ? Math.min(1, Math.max(0, from.scrollTop / fromMax)) : 0;
            to.scrollTop = ratio * toMax;
            expected.set(to, to.scrollTop);
          };
          const onScroll = (from, to) => {
            if (active !== from) return;
            const echoed = expected.get(from);
            if (echoed !== undefined && Math.abs(from.scrollTop - echoed) <= 1) {
              expected.delete(from);
              return;
            }
            sync(from, to);
          };
          editor.addEventListener("scroll", () => onScroll(editor, preview), { passive: true });
          preview.addEventListener("scroll", () => onScroll(preview, editor), { passive: true });
        }

        function insertAtCursor(text, selectOffset) {
          const editor = document.getElementById("editor");
          if (!editor) return;
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.setRangeText(text, start, end, "end");
          if (typeof selectOffset === "number") editor.setSelectionRange(start + selectOffset, start + selectOffset);
          editor.dispatchEvent(new Event("input", { bubbles: true }));
          editor.focus();
        }

        function wrapSelection(marker) {
          const editor = document.getElementById("editor");
          if (!editor) return;
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          const selected = editor.value.slice(start, end) || "text";
          editor.setRangeText(marker + selected + marker, start, end, "select");
          editor.dispatchEvent(new Event("input", { bubbles: true }));
          editor.focus();
        }

        function prefixLines(prefix) {
          const editor = document.getElementById("editor");
          if (!editor) return;
          const start = editor.selectionStart;
          const lineStart = editor.value.lastIndexOf("\n", start - 1) + 1;
          editor.setRangeText(prefix, lineStart, lineStart, "end");
          editor.dispatchEvent(new Event("input", { bubbles: true }));
          editor.focus();
        }

        function insertLink() {
          const editor = document.getElementById("editor");
          if (!editor) return;
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          const selected = editor.value.slice(start, end).trim();
          const label = selected || "link";
          const text = "[" + label + "](https://)";
          editor.setRangeText(text, start, end, "end");
          const urlStart = start + label.length + 3;
          editor.setSelectionRange(urlStart, urlStart + 8);
          editor.dispatchEvent(new Event("input", { bubbles: true }));
          editor.focus();
        }

        function applyMarkdown(action) {
          const editor = document.getElementById("live-editor");
          if (!editor) return;
          const current = window.getSelection();
          if (!current || !current.rangeCount || !editor.contains(current.anchorNode)) editor.focus();
          if (action === "h1" || action === "h2") {
            const block = currentLiveBlock(editor);
            const target = action === "h1" ? "h1" : "h2";
            const active = block && block.tagName.toLowerCase() === target;
            document.execCommand("formatBlock", false, active ? "p" : target);
          } else if (action === "bold") {
            document.execCommand("bold");
          } else if (action === "italic") {
            document.execCommand("italic");
          } else if (action === "strike") {
            document.execCommand("strikeThrough");
          } else if (action === "ul") {
            document.execCommand("insertUnorderedList");
          } else if (action === "ol") {
            document.execCommand("insertOrderedList");
          } else if (action === "task") {
            insertTaskItem(editor);
          } else if (action === "quote") {
            document.execCommand("formatBlock", false, "blockquote");
          } else if (action === "code") {
            insertInlineCode(editor);
          } else if (action === "link") {
            insertLiveLink(editor);
          } else if (action === "hr") {
            document.execCommand("insertHorizontalRule");
          } else if (action === "table") {
            insertTable();
          } else if (action === "attach") {
            pickAttachments();
            return;
          }
          onLiveInput({ currentTarget: editor });
        }

        function insertTaskItem(editor) {
          const block = currentLiveBlock(editor);
          const makeList = () => {
            const list = document.createElement("ul");
            const item = document.createElement("li");
            item.className = "task";
            const box = document.createElement("input");
            box.type = "checkbox";
            const span = document.createElement("span");
            span.textContent = " ";
            item.appendChild(box);
            item.appendChild(span);
            list.appendChild(item);
            return { list, span };
          };
          if (block && (block.tagName === "P" || block.tagName === "DIV")) {
            const made = makeList();
            block.replaceWith(made.list);
            placeCaretAtEnd(made.span);
          } else {
            const selection = window.getSelection();
            if (selection && selection.rangeCount) {
              const made = makeList();
              selection.getRangeAt(0).insertNode(made.list);
              placeCaretAtEnd(made.span);
            }
          }
        }

        function insertTable() {
          document.execCommand("insertHTML", false, '<table><thead><tr><th>' + esc(t("tableCol")) + ' 1</th><th>' + esc(t("tableCol")) + ' 2</th></tr></thead><tbody><tr><td> </td><td> </td></tr></tbody></table><p><br></p>');
        }

        function insertInlineCode(editor) {
          const selection = window.getSelection();

        function insertLiveLink(editor) {
          const selection = window.getSelection();

        function isDescendantLocal(candidateId, ancestorId) {
          let current = candidateId;
          let guard = 0;
          while (current && guard++ < 256) {
            if (current === ancestorId) return true;
            const note = noteById(current);
            if (!note) return false;
            current = note.parentId;
          }
          return false;
        }

        async function reorderNote(id, parentId, index) {
          if (!(await saveNow(false))) return;
          try {
            await rpc("notes/reorder", { id, parentId: parentId || null, index });
            if (parentId) collapsed.delete(parentId);
            await reload(true);
            renderMain();
          } catch (error) {

            renderTree();
