<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBX Notes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: var(--color-background, #f7f6f3);
        --fg: var(--color-foreground, #25231f);
        --panel: var(--color-card, #ffffff);
        --panel-2: var(--color-muted, #efeee9);
        --muted: var(--color-muted-foreground, #77736b);
        --border: var(--color-border, #e4e1da);
        --primary: var(--color-primary, #3d63dd);
        --primary-fg: var(--color-primary-foreground, #ffffff);
        --danger: var(--color-danger, #c0392b);
        --radius: var(--radius-md, 10px);
        --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        --sans: var(--font-sans, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif);
        --sidebar: 268px;
      }
      html[data-dbx-theme="dark"] {
        --bg: var(--color-background, #17181a);
        --fg: var(--color-foreground, #ecebe7);
        --panel: var(--color-card, #1f2023);
        --panel-2: var(--color-muted, #2a2b2e);
        --muted: var(--color-muted-foreground, #9c9a94);
        --border: var(--color-border, #333438);
        --danger: var(--color-danger, #ff6b5e);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--sans);
        font-size: 14px;
        color: var(--fg);
        background: var(--bg);
        overflow: hidden;
      }
      button, input, textarea, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      ::selection { background: color-mix(in srgb, var(--primary) 26%, transparent); }
      .app { display: flex; height: 100vh; min-height: 0; }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar);
        flex: 0 0 var(--sidebar);
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel-2);
        border-right: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 9px; padding: 14px 14px 8px; }
      .brand .logo {
        width: 26px; height: 26px; border-radius: 8px;
        background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 55%, #9b59ff));
        display: grid; place-items: center; color: #fff; flex: 0 0 auto;
      }
      .brand .name { font-weight: 650; font-size: 14px; letter-spacing: .01em; }
      .brand .vault { color: var(--muted); font-size: 11px; margin-top: 1px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .brand .spacer { flex: 1; }
      .icon-btn {
        display: inline-grid; place-items: center;
        width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px;
        background: transparent; color: var(--muted);
      }
      .icon-btn:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); }
      .icon-btn.active { color: var(--primary); }
      .icon-btn:disabled { opacity: .45; cursor: default; }
      .icon-btn svg { width: 16px; height: 16px; }

      .search-wrap { padding: 6px 12px 8px; }
      .search {
        display: flex; align-items: center; gap: 7px;
        padding: 0 9px; height: 32px;
        border: 1px solid var(--border); border-radius: 8px;
        background: var(--panel);
      }
      .search svg { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
      .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; }
      .search kbd { color: var(--muted); font-family: var(--mono); font-size: 10px; border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; }

      .new-page {
        margin: 0 12px 8px; height: 33px; border: 1px dashed var(--border); border-radius: 8px;
        background: transparent; color: var(--muted); display: flex; align-items: center; gap: 7px;
        padding: 0 10px; font-size: 13px;
      }
      .new-page:hover { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 50%, var(--border)); background: color-mix(in srgb, var(--primary) 6%, transparent); }
      .new-page svg { width: 15px; height: 15px; }

      .nav { display: flex; gap: 2px; padding: 0 10px 6px; }
      .nav button {
        flex: 1; border: 0; background: transparent; color: var(--muted);
        border-radius: 7px; padding: 6px 2px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 5px;
      }
      .nav button .count { font-size: 10px; opacity: .8; }
      .nav button.active { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--border) inset; }

      .tree { flex: 1; min-height: 0; overflow-y: auto; padding: 3px 8px 16px; }
      .tree-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 28px 10px; line-height: 1.7; }
      .page-row {
        position: relative; display: flex; align-items: center; gap: 4px;
        padding: 5px 4px 5px 3px; border-radius: 7px; cursor: pointer;
        color: var(--fg); min-height: 30px;
        user-select: none; -webkit-user-select: none;
      }
      body.page-dragging, body.page-dragging * { cursor: grabbing !important; }
      .page-row.drag-ghost {
        position: fixed; z-index: 9999; pointer-events: none; opacity: .92;
        background: var(--panel); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.18);
      }
      .page-row:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
      .page-row.selected { background: color-mix(in srgb, var(--primary) 14%, transparent); color: var(--fg); }
      .page-row.selected .page-title { font-weight: 600; }
      .page-row.dragging { opacity: .4; }
      .page-row.drop-inside { background: color-mix(in srgb, var(--primary) 16%, transparent); box-shadow: inset 0 0 0 2px var(--primary); }
      .page-row.drop-before::before, .page-row.drop-after::after {
        content: ""; position: absolute; left: 8px; right: 8px; height: 2px; border-radius: 2px; background: var(--primary);
      }
      .page-row.drop-before::before { top: -1px; }
      .page-row.drop-after::after { bottom: -1px; }
      .chev { width: 18px; height: 18px; flex: 0 0 18px; display: grid; place-items: center; color: var(--muted); border: 0; background: transparent; padding: 0; border-radius: 4px; }
      .chev svg { width: 12px; height: 12px; transition: transform .12s ease; }
      .chev.open svg { transform: rotate(90deg); }
      .chev.leaf { visibility: hidden; }
      .page-icon { width: 17px; height: 17px; flex: 0 0 17px; display: grid; place-items: center; color: var(--muted); }
      .page-icon svg { width: 15px; height: 15px; }
      .page-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .page-row .row-actions { display: none; align-items: center; gap: 1px; }
      .page-row:hover .row-actions, .page-row.selected .row-actions { display: flex; }
      .page-row .star-on { color: #e0a72e; }
      .row-actions .icon-btn { width: 22px; height: 22px; }
      .row-actions .icon-btn svg { width: 13px; height: 13px; }
      .row-emoji { font-size: 13px; line-height: 1; }
      .icon-btn.star-on { color: #e0a72e; }
      .icon-btn.star-on svg { fill: #e0a72e; }
      .page-row .star-btn { display: none; }
      .page-row:hover .star-btn, .page-row .star-btn.star-on { display: grid; }
      .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); position: absolute; right: 6px; top: 6px; display: none; }
      .page-row.dirty .badge-dot { display: block; }

      .sidebar-foot { border-top: 1px solid var(--border); padding: 9px 12px; display: flex; flex-direction: column; gap: 6px; }
      .sync-line { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); min-height: 18px; }
      .sync-line .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
      .sync-line .dot.ok { background: #2eaa68; }
      .sync-line .dot.warn { background: #d9822b; }
      .sync-line .dot.err { background: var(--danger); }
      .sync-line .dot.busy { background: var(--primary); animation: pulse 1.1s infinite; }
      @keyframes pulse { 50% { opacity: .25; } }
      .sync-line .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sync-line button { margin-left: auto; border: 0; background: transparent; color: var(--primary); font-size: 11.5px; padding: 0; }
      .sync-line button:disabled { color: var(--muted); }
      .mode-chip { border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

      /* Main */
      .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel); }
      .tabbar {
        display: flex; align-items: stretch; gap: 4px; flex-wrap: nowrap;
        padding: 6px 10px 0; border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel-2) 60%, var(--panel));
        overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
      }
      .tabbar.multi { flex-wrap: wrap; overflow-x: hidden; }
      .tab {
        display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
        max-width: 200px; height: 30px; padding: 0 5px 0 9px;
        border: 1px solid var(--border); border-bottom-color: transparent;
        border-radius: 8px 8px 0 0; background: var(--panel-2);
        color: var(--muted); font-size: 12px; cursor: pointer; user-select: none;
      }
      .tab:hover { color: var(--fg); }
      .tab.active { background: var(--panel); color: var(--fg); box-shadow: 0 1px 0 var(--panel); }
      .tab .tab-icon { font-size: 13px; flex: 0 0 auto; }
      .tab .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex: 0 0 auto; }
      .tab .tab-close { border: 0; background: transparent; color: var(--muted); width: 19px; height: 19px; border-radius: 4px; display: grid; place-items: center; padding: 0; flex: 0 0 auto; }
      .tab .tab-close:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--fg); }
      .tab .tab-close svg { width: 12px; height: 12px; }
      .tab-layout { margin-left: auto; align-self: center; flex: 0 0 auto; }
      .topbar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--border); min-height: 48px; }
      .crumbs { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; }
      .crumbs button { border: 0; background: transparent; color: inherit; padding: 2px 4px; border-radius: 4px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .crumbs button:hover { background: var(--panel-2); color: var(--fg); }
      .crumbs .sep { opacity: .5; }
      .topbar .spacer { flex: 1; }
      .topbar .status { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
      .topbar .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
      .topbar .status .dot.ok { background: #2eaa68; }
      .topbar .status .dot.busy { background: var(--primary); animation: pulse 1s infinite; }
      .topbar .status .dot.err { background: var(--danger); }
      .toolbar {
        display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
        padding: 6px 14px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--panel-2) 45%, var(--panel));
      }
      .toolbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
      .toolbar .icon-btn { width: 27px; height: 27px; }
      .toolbar .icon-btn svg { width: 15px; height: 15px; }
      .toolbar .seg { display: flex; margin-left: auto; background: var(--panel-2); border-radius: 7px; padding: 2px; }
      .toolbar .seg button { border: 0; background: transparent; color: var(--muted); border-radius: 5px; padding: 3px 8px; font-size: 11.5px; }
      .toolbar .seg button.active { background: var(--panel); color: var(--fg); box-shadow: 0 0 0 1px var(--border) inset; }

      .doc { flex: 1; min-height: 0; overflow-y: auto; }
      .doc-inner { max-width: 860px; margin: 0 auto; padding: 30px 42px 20px; }
      .doc-head { display: flex; align-items: flex-start; gap: 10px; }
      .doc-head .page-emoji { font-size: 34px; line-height: 1.1; width: 44px; height: 44px; text-align: center; flex: 0 0 auto; border: 0; background: transparent; padding: 0; border-radius: 9px; cursor: pointer; }
      .doc-head .page-emoji:hover { background: var(--panel-2); }
      .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; max-height: 300px; overflow-y: auto; margin: 10px 0 4px; }
      .emoji-grid button { font-size: 22px; line-height: 1; height: 38px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; }
      .emoji-grid button:hover { background: var(--panel-2); }
      .icon-modal-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
      .title-input {
        flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
        font-size: 32px; line-height: 1.18; font-weight: 700; letter-spacing: -.02em; padding: 0;
      }
      .title-input::placeholder { color: color-mix(in srgb, var(--muted) 55%, transparent); }
      .doc-title { flex: 1; min-width: 0; font-size: 32px; line-height: 1.18; font-weight: 700; letter-spacing: -.02em; padding: 0; overflow-wrap: anywhere; }
      .doc-head .page-emoji.static { cursor: default; }
      .doc-head .page-emoji.static:hover { background: transparent; }
      .readonly-chip { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
      .doc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; color: var(--muted); font-size: 11.5px; }
      .tag-list { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
      .tag { background: color-mix(in srgb, var(--primary) 10%, transparent); color: color-mix(in srgb, var(--primary) 75%, var(--fg)); border-radius: 5px; padding: 1px 6px; font-size: 11px; }
      .tag-input { border: 0; outline: 0; background: transparent; font-size: 11.5px; color: var(--muted); min-width: 90px; width: 120px; }
      .tag-input:focus { color: var(--fg); }
      .doc-meta .spacer { flex: 1; }

      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 14px; align-items: start; }
      .panes.edit-only { grid-template-columns: 1fr; }
      .panes.preview-only { grid-template-columns: 1fr; }
      .pane-label { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
      .editor-wrap, .preview-wrap { min-width: 0; }
      textarea.editor {
        width: 100%; min-height: 52vh; resize: none; overflow-y: hidden; border: 0; outline: 0;
        background: transparent; color: var(--fg); font-family: var(--mono); font-size: 13.5px; line-height: 1.72;
        padding: 0 0 40px; tab-size: 2;
      }
      .preview {
        min-height: 52vh; font-size: 15px; line-height: 1.78; padding-bottom: 40px; overflow-wrap: anywhere;
      }
      @media (min-width: 761px) {
        .doc.split-mode { overflow: hidden; }
        .doc.split-mode .doc-inner { height: 100%; display: flex; flex-direction: column; }
        .doc.split-mode .panes { flex: 1; min-height: 0; align-items: stretch; }
        .doc.split-mode .editor-wrap, .doc.split-mode .preview-wrap { display: flex; flex-direction: column; min-height: 0; }
        .doc.split-mode textarea.editor { flex: 1; min-height: 0; height: auto; overflow-y: auto; }
        .doc.split-mode .preview { flex: 1; min-height: 0; overflow-y: auto; }
      }
      .preview > :first-child { margin-top: 0; }
      .preview h1 { font-size: 27px; line-height: 1.25; margin: 1.2em 0 .45em; letter-spacing: -.015em; }
      .preview h2 { font-size: 21px; margin: 1.25em 0 .4em; letter-spacing: -.01em; }
      .preview h3 { font-size: 17px; margin: 1.15em 0 .35em; }
      .preview h4, .preview h5, .preview h6 { font-size: 15px; margin: 1em 0 .3em; }
      .preview p { margin: .55em 0; }
      .preview ul, .preview ol { margin: .45em 0; padding-left: 1.4em; }
      .preview li { margin: .18em 0; }
      .preview li.task { list-style: none; margin-left: -1.35em; display: flex; gap: 7px; align-items: flex-start; }
      .preview li.task input { margin: 4px 0 0; accent-color: var(--primary); }
      .preview blockquote { margin: .7em 0; padding: .15em 0 .15em 14px; border-left: 3px solid color-mix(in srgb, var(--primary) 45%, var(--border)); color: color-mix(in srgb, var(--fg) 82%, var(--muted)); }
      .preview code { font-family: var(--mono); font-size: .86em; background: var(--panel-2); padding: .15em .35em; border-radius: 4px; }
      .preview pre { background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: .8em 0; }
      .preview pre code { background: transparent; padding: 0; font-size: .86em; line-height: 1.6; }
      .preview hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }
      .preview a { color: var(--primary); text-decoration: none; }
      .preview a:hover { text-decoration: underline; }
      .preview table { border-collapse: collapse; width: 100%; margin: .9em 0; font-size: .92em; }
      .preview th, .preview td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
      .preview th { background: var(--panel-2); font-weight: 600; }
      .preview img { max-width: 100%; border-radius: 8px; }
      .live-editor { min-height: 52vh; outline: 0; cursor: text; }
      .live-editor:focus { outline: 0; }
      .live-editor:empty::before { content: attr(data-placeholder); color: color-mix(in srgb, var(--muted) 55%, transparent); }
      .table-tools { position: fixed; z-index: 30; display: flex; align-items: center; gap: 2px; padding: 3px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.16); }
      .table-tools[hidden] { display: none; }
      .table-tools button { border: 0; background: transparent; color: var(--fg); font-size: 11.5px; padding: 4px 7px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
      .table-tools button:hover { background: var(--panel-2); }
      .table-tools button.danger { color: var(--danger); }
      .table-tools button:disabled { color: var(--muted); cursor: default; background: transparent; }
      .ctx-menu { position: fixed; z-index: 40; min-width: 170px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 34px rgba(0,0,0,.18); padding: 4px; font-size: 12.5px; color: var(--fg); }
      .ctx-menu[hidden] { display: none; }
      .ctx-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
      .ctx-item:hover { background: var(--panel-2); }
      .ctx-item.disabled { color: var(--muted); pointer-events: none; }
      .ctx-item .ctx-arrow { color: var(--muted); font-size: 10px; }
      .ctx-sep { height: 1px; background: var(--border); margin: 4px 2px; }
      .ctx-sub { position: fixed; z-index: 41; min-width: 150px; }
      .table-grip { position: fixed; z-index: 35; display: none; align-items: center; justify-content: center; width: 26px; height: 30px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--muted); font-size: 13px; cursor: grab; box-shadow: 0 2px 8px rgba(0,0,0,.14); user-select: none; }
      .table-grip::before { content: ""; position: absolute; inset: -10px; }
      .table-grip:hover { background: var(--panel-2); color: var(--fg); }
      .table-grip.show { display: flex; }
      .table-grip.dragging { cursor: grabbing; }
      body.table-dragging, body.table-dragging * { cursor: grabbing !important; user-select: none !important; }
      tr.drop-before > td, tr.drop-before > th { box-shadow: inset 0 2px 0 var(--primary); }
      tr.drop-after > td, tr.drop-after > th { box-shadow: inset 0 -2px 0 var(--primary); }
      td.drop-before, th.drop-before { box-shadow: inset 2px 0 0 var(--primary); }
      td.drop-after, th.drop-after { box-shadow: inset -2px 0 0 var(--primary); }
      .preview .empty-hint { color: var(--muted); font-style: italic; }

      .doc-foot { border-top: 1px solid var(--border); padding: 8px 18px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 11px; }      .doc-foot .spacer { flex: 1; }
      .doc-foot a { color: var(--primary); text-decoration: none; }

      .empty-main { flex: 1; display: grid; place-items: center; padding: 40px; }
      .empty-card { max-width: 420px; text-align: center; color: var(--muted); line-height: 1.8; }
      .empty-card .big { width: 58px; height: 58px; border-radius: 16px; margin: 0 auto 16px; display: grid; place-items: center; background: var(--panel-2); color: var(--primary); }
      .empty-card .big svg { width: 26px; height: 26px; }
      .empty-card h2 { color: var(--fg); margin: 0 0 6px; font-size: 19px; }
      .empty-card p { margin: 0 0 16px; font-size: 13px; }
      .btn {
        border: 1px solid var(--border); background: var(--panel); color: var(--fg);
        border-radius: 8px; height: 32px; padding: 0 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
      }
      .btn:hover { background: var(--panel-2); }
      .btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
      .btn.primary:hover { filter: brightness(1.06); }
      .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
      .btn.danger:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }
      .btn.ghost { border-color: transparent; background: transparent; }
      .btn svg { width: 15px; height: 15px; }

      /* Trash */
      .trash-wrap { max-width: 720px; padding-top: 22px; }
      .trash-hint { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
      .trash-item { display: flex; align-items: center; gap: 14px; padding: 12px 2px; border-bottom: 1px solid var(--border); }
      .trash-info { flex: 1; min-width: 0; }
      .trash-title { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .trash-meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      .trash-actions { display: flex; gap: 6px; flex: 0 0 auto; }
      .trash-actions .btn { height: 28px; padding: 0 9px; font-size: 12px; }
      @media (max-width: 560px) {
        .trash-item { flex-direction: column; align-items: stretch; }
        .trash-actions { justify-content: flex-end; }
      }

      /* Modal */
      .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.38); display: grid; place-items: center; padding: 20px; z-index: 50; }
      .modal { width: min(560px, 100%); max-height: 84vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 24px 70px rgba(0,0,0,.3); padding: 20px 22px; }
      .modal h3 { margin: 0 0 8px; font-size: 17px; }
      .modal p { color: var(--muted); line-height: 1.65; margin: 6px 0; font-size: 13px; }
      .modal .field { margin: 12px 0; }
      .modal .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
      .modal .field .value { font-family: var(--mono); font-size: 12.5px; word-break: break-all; background: var(--panel-2); padding: 7px 9px; border-radius: 7px; }
      .modal .field select { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); padding: 0 8px; }
      .modal .field input[type="text"], .modal .field input[type="password"], .modal .field input[type="number"] { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--fg); padding: 0 9px; }
      .modal .field .checkline { display: flex; align-items: center; gap: 7px; text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--muted); }
      .modal .field .checkline input { width: auto; }
      .cfg-sep { height: 1px; background: var(--border); margin: 14px 0 10px; }
      .modal .linklike { border: 0; background: transparent; color: var(--muted); font-size: 11.5px; padding: 0; text-decoration: underline; cursor: pointer; }
      .modal .linklike:hover { color: var(--fg); }
      .cfg-group { display: none; }
      .cfg-group.show { display: block; }
      .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
      .modal .note { font-size: 12px; color: var(--muted); background: var(--panel-2); border-radius: 8px; padding: 9px 11px; line-height: 1.6; }

      .toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(380px, calc(100vw - 36px)); }
      .toast { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--primary); border-radius: 9px; padding: 9px 12px; font-size: 12.5px; box-shadow: 0 8px 28px rgba(0,0,0,.16); line-height: 1.5; animation: slide .18s ease; }
      .toast.err { border-left-color: var(--danger); }
      .toast.ok { border-left-color: #2eaa68; }
      @keyframes slide { from { transform: translateY(6px); opacity: 0; } }

      .fatal { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 80; padding: 24px; }
      .fatal .box { max-width: 460px; text-align: center; }
      .fatal h2 { margin: 12px 0 6px; font-size: 18px; }
      .fatal p { color: var(--muted); line-height: 1.7; font-size: 13px; }
      .fatal .detail { font-family: var(--mono); font-size: 11.5px; color: var(--muted); background: var(--panel-2); border-radius: 8px; padding: 9px; margin: 10px 0; word-break: break-word; }
      .fatal .big { width: 54px; height: 54px; border-radius: 15px; margin: 0 auto; display: grid; place-items: center; background: var(--panel-2); color: var(--danger); }
      .fatal .big svg { width: 26px; height: 26px; }

      .mobile-toggle { display: inline-grid; }
      .icon-btn.on { color: var(--primary); background: var(--panel-2); }
      .child-pages { position: fixed; right: 18px; bottom: 44px; z-index: 22; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
      .child-pages .child-head { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); color: var(--fg); font-size: 12px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.14); }
      .child-pages .child-head:hover { background: var(--panel-2); }
      .child-pages .child-head svg { width: 14px; height: 14px; color: var(--muted); }
      .child-pages .child-count { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center; }
      .child-pages.collapsed .child-label { display: none; }
      .child-pages.collapsed .child-head { padding: 0 8px; }
      .child-pages .child-list { display: none; width: 220px; max-height: 40vh; overflow: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 6px; }
      .child-pages:not(.collapsed) .child-list { display: flex; flex-direction: column; gap: 2px; }
      .child-pages .child-link { display: flex; align-items: center; gap: 7px; width: 100%; border: 0; background: transparent; color: var(--fg); padding: 6px 7px; border-radius: 7px; cursor: pointer; font-size: 12.5px; text-align: left; }
      .child-pages .child-link:hover { background: var(--panel-2); }
      .child-pages .child-link .row-emoji { font-size: 13px; }
      @media (min-width: 761px) { .app.sidebar-hidden .sidebar { display: none; } .app:not(.sidebar-hidden) .child-pages { display: none; } }
      @media (max-width: 760px) { .child-pages { left: auto; right: 12px; bottom: 54px; } .child-pages .child-list { width: min(220px, calc(100vw - 24px)); } }
      @media (max-width: 760px) {
        :root { --sidebar: 250px; }
        .sidebar { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; transform: translateX(-102%); transition: transform .18s ease; box-shadow: 12px 0 40px rgba(0,0,0,.18); }
        .sidebar.open { transform: none; }
        .mobile-toggle { display: inline-grid; }
        .doc-inner { padding: 20px 18px 14px; }
        .panes { grid-template-columns: 1fr; }
        .panes.split .preview-wrap { display: none; }
        .panes.home-demo { grid-template-columns: 1fr; }
        .panes.home-demo .preview-wrap { display: block; }
        .toolbar .seg { margin-left: 0; }
        .topbar { padding: 8px 12px; }
        .title-input { font-size: 25px; }
        .doc-head .page-emoji { font-size: 26px; width: 34px; }
      }
      .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 25; }
      .scrim.show { display: block; }
    </style>

      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>

          </button>
        </div>

        <div class="search-wrap">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search notes" autocomplete="off" />

        <button class="new-page" id="new-page">

            if (/text-align\s*:\s*left/.test(style)) return "left";

            if (align === "right") return "---:";
            if (align === "left") return ":---";

              item.appendChild(span);
