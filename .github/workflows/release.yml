name: Release DBX Notes plugin

on:
  release:
    types: [published]

permissions:
  contents: write

# Same tag cannot run twice concurrently; different tags are independent.
concurrency:
  group: release-notes-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v')
    # Native sidecar: one unsigned candidate per target.
    # Default matrix: darwin-arm64, darwin-x64, windows-x64, linux-x64, linux-arm64.
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.10
